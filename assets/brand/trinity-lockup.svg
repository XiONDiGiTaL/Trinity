<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">Trinity lockup</title>
  <desc id="desc">The Trinity wrench-and-knot mark beside the gradient wordmark and its tagline.</desc>
  <defs>
    <linearGradient id="word" x1="250" y1="86" x2="700" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d35b8"/>
      <stop offset=".38" stop-color="#4d8dff"/>
      <stop offset=".7" stop-color="#2aa8b2"/>
      <stop offset="1" stop-color="#e2bd5c"/>
    </linearGradient>
    <linearGradient id="rule" x1="252" y1="145" x2="690" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d35b8"/>
      <stop offset=".55" stop-color="#2aa8b2"/>
      <stop offset="1" stop-color="#e2bd5c" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="mark-gold" x1="38" y1="24" x2="214" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7e3a1"/><stop offset=".5" stop-color="#d9b45a"/><stop offset="1" stop-color="#9b6f22"/>
    </linearGradient>
    <linearGradient id="mark-violet" x1="46" y1="72" x2="210" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54218f"/><stop offset="1" stop-color="#9a68ee"/>
    </linearGradient>
    <linearGradient id="mark-blue" x1="52" y1="184" x2="210" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2a6cff"/><stop offset="1" stop-color="#8bc2ff"/>
    </linearGradient>
    <linearGradient id="mark-teal" x1="42" y1="128" x2="214" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f6f78"/><stop offset="1" stop-color="#39d0c8"/>
    </linearGradient>
  </defs>
  <g transform="translate(8 10) scale(.78)">
    <path d="M147.5 45.7a37 37 0 0 0-52.3 45.4l-47.7 47.7a18.7 18.7 0 1 0 26.5 26.5l47.7-47.7a37 37 0 0 0 45.4-52.3l-24.8 24.8-19.6-4.9-4.9-19.6 24.7-24.9Z"
      fill="none" stroke="url(#mark-gold)" stroke-width="12" stroke-linejoin="round"/>
    <g fill="none" stroke-linecap="round">
      <ellipse cx="128" cy="128" rx="79" ry="34" stroke="#8a6420" stroke-width="13"/>
      <ellipse cx="128" cy="128" rx="79" ry="34" transform="rotate(60 128 128)" stroke="#8a6420" stroke-width="13"/>
      <ellipse cx="128" cy="128" rx="79" ry="34" transform="rotate(120 128 128)" stroke="#8a6420" stroke-width="13"/>
      <ellipse cx="128" cy="128" rx="79" ry="34" stroke="url(#mark-violet)" stroke-width="7"/>
      <ellipse cx="128" cy="128" rx="79" ry="34" transform="rotate(60 128 128)" stroke="url(#mark-blue)" stroke-width="7"/>
      <ellipse cx="128" cy="128" rx="79" ry="34" transform="rotate(120 128 128)" stroke="url(#mark-teal)" stroke-width="7"/>
    </g>
    <circle cx="128" cy="128" r="10" fill="#08090c" stroke="url(#mark-gold)" stroke-width="3"/>
  </g>
  <text x="248" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-style="italic" font-weight="700" letter-spacing="2" fill="url(#word)" stroke="#d9b45a" stroke-width="1.2" paint-order="stroke">TRINITY</text>
  <rect x="252" y="148" width="438" height="5" rx="2.5" fill="url(#rule)"/>
  <text x="254" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="16" letter-spacing="4.2" fill="#aab1bd">THE THREE HOUSES OF INNOVATION</text>
</svg>
