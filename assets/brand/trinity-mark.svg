<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Trinity mark</title>
  <desc id="desc">A gold wrench beneath three interlocking violet, blue and teal loops.</desc>
  <defs>
    <linearGradient id="gold" x1="40" y1="24" x2="216" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7e3a1"/>
      <stop offset=".45" stop-color="#d9b45a"/>
      <stop offset="1" stop-color="#9b6f22"/>
    </linearGradient>
    <linearGradient id="violet" x1="42" y1="72" x2="214" y2="184" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#54218f"/>
      <stop offset="1" stop-color="#8e5be8"/>
    </linearGradient>
    <linearGradient id="blue" x1="48" y1="176" x2="212" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a6cff"/>
      <stop offset="1" stop-color="#8bc2ff"/>
    </linearGradient>
    <linearGradient id="teal" x1="40" y1="128" x2="216" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f6f78"/>
      <stop offset="1" stop-color="#39d0c8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <g filter="url(#soft)">
    <path d="M147.5 45.7a37 37 0 0 0-52.3 45.4l-47.7 47.7a18.7 18.7 0 1 0 26.5 26.5l47.7-47.7a37 37 0 0 0 45.4-52.3l-24.8 24.8-19.6-4.9-4.9-19.6 24.7-24.9Z"
      fill="none" stroke="url(#gold)" stroke-width="13" stroke-linejoin="round" opacity=".96"/>
    <g fill="none" stroke-linecap="round">
      <ellipse cx="128" cy="128" rx="79" ry="34" transform="rotate(0 128 128)" stroke="#8a6420" stroke-width="14"/>
      <ellipse cx="128" cy="128" rx="79" ry="34" transform="rotate(60 128 128)" stroke="#8a6420" stroke-width="14"/>
      <ellipse cx="128" cy="128" rx="79" ry="34" transform="rotate(120 128 128)" stroke="#8a6420" stroke-width="14"/>
      <ellipse cx="128" cy="128" rx="79" ry="34" transform="rotate(0 128 128)" stroke="url(#violet)" stroke-width="8"/>
      <ellipse cx="128" cy="128" rx="79" ry="34" transform="rotate(60 128 128)" stroke="url(#blue)" stroke-width="8"/>
      <ellipse cx="128" cy="128" rx="79" ry="34" transform="rotate(120 128 128)" stroke="url(#teal)" stroke-width="8"/>
    </g>
    <circle cx="128" cy="128" r="10.5" fill="#050607" stroke="url(#gold)" stroke-width="3"/>
    <circle cx="128" cy="128" r="3.2" fill="url(#gold)"/>
  </g>
</svg>
